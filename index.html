</svg><div class="scanline"></div>${interactive?`<button class="scan-target" data-k="kasten" aria-label="Elektroverteiler untersuchen">+</button><button class="scan-target" data-k="person" aria-label="Verletzte Person untersuchen">+</button><button class="scan-target" data-k="warn" aria-label="Warnsymbol untersuchen">+</button><button class="scan-target" data-k="umfeld" aria-label="Umgebung untersuchen">+</button>`:''}<div class="visual-caption"><span>⚡ <b>Unfallstelle im Technikraum</b></span><span>${interactive?'◉ TIPPE DIE MARKIERUNGEN AN':'STATUS · STROMVERSORGUNG UNKLAR'}</span></div></div>`}
function sceneStrip(txt='Einsatzlage: Technikraum im Neubau'){return `<div class="scene-feature">${sceneArtwork(false)}<div class="scene-caption">🏭 <strong>Einsatz:</strong> ${txt}</div></div>`}function shell(title,body,k='MISSION 112'){clearInterval(beatTimer);beatTimer=null;window.scrollTo({top:0,behavior:'instant'});app.innerHTML=`<div class="top"><div class="brand">⚡ MISSION 112 <span style="color:#9ab4c6">/ LIVE TRAINING</span></div><div class="chip">🔒 Schüler-Modus</div></div>${stage?`<div class="statline"><div class="stat">🗺 ${stage}/7 · ${chapters[stage]}</div><div class="stat">⭐ ${points} Punkte</div><div class="stat">🔄 ${errors} Lernmomente</div></div><div class="progress" aria-label="Fortschritt"><div style="width:${Math.max(0,(stage/7)*100)}%"></div></div>`:''}<div class="kicker">${k}</div><h2>${title}</h2>${body}<div class="footer">Simulation für den Unterricht · Keine reale Erste-Hilfe-Ausbildung · Im Notfall: Eigenschutz, 112 und Anweisungen der Leitstelle befolgen.</div>`}function next(){stage++;render()}function addPts(n){points+=n}function shuffle(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function optionQuestion({title,desc,options,correct,why,wrong,tip,after,pts=12}){let done=false;let body=`<div class="card"><p>${desc}</p><div class="answer-grid" id="choices">${options.map((v,i)=>`<button class="choice" data-i="${i}"><span class="tag">${String.fromCharCode(65+i)}.</span> ${esc(v)}</button>`).join('')}</div><div id="feedback" role="status"></div></div>`;shell(title,body,'ENTSCHEIDUNG · ERST DENKEN, DANN HANDELN');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(done)return;let i=+b.dataset.i,ok=i===correct;if(ok)addPts(pts);else errors++;b.classList.add(ok?'correct':'wrong');document.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(+x.dataset.i===correct)x.classList.add('correct')});document.getElementById('feedback').innerHTML=`<div class="${ok?'good':'warning'}"><strong>${ok?'✅ Richtig entschieden!':'⚠️ Kritische Entscheidung – hier lernst du dazu.'}</strong><p>${ok?why:wrong+' '+why}</p></div>${tip?`<div class="tip">💡 <strong>Werkstattwissen:</strong> ${tip}</div>`:''}<div class="buttons"><button class="btn" id="go">Einsatz fortsetzen →</button></div>`;done=true;document.getElementById('go').onclick=after})}
function render(){if(stage===0)return home();if(stage===1)return spotScene();if(stage===2)return decisionOne();if(stage===3)return emergencyCall();if(stage===4)return cpr();if(stage===5)return otherCase();if(stage===6)return finale();return results()}
function home(){shell('STROMUNFALL. DU ENTSCHEIDEST.',`<div class="hero">${sceneArtwork(false)}<div class="hero-copy"><div class="kicker">FUNKSPRUCH AUS DEM NEUBAU</div><h1>MISSION <span style="color:var(--gold)">112</span></h1><p>Du bist im 1. Ausbildungsjahr. Vor dir: ein <strong>geöffneter Elektrokasten</strong>, Warnhinweise und ein <strong>Kollege, der am Boden liegt</strong>. Die Stromversorgung ist unklar. Deine Entscheidungen bestimmen, wie die Geschichte weitergeht.</p><div class="statline"><div class="stat">🎮 7 Spielstationen</div><div class="stat">📱 Handyoptimiert</div><div class="stat">🧠 Entscheidungen mit Folgen</div></div><div class="buttons"><button class="btn" id="start">EINSATZ STARTEN ⚡</button></div></div></div><div class="brief"><strong>Dein Auftrag:</strong> Eigenschutz, Notruf und Erste Hilfe korrekt verknüpfen. Fehler sind hier erlaubt – bei echten Stromunfällen niemals unüberlegt handeln.</div><p class="mini">Du brauchst nur dein Smartphone. Kein Login, kein Tracking, kein Internet nach dem Laden. Alle Einsatzsituationen sind fiktiv.</p>`,'EINSATZZENTRALE // KANAL 112');document.getElementById('start').onclick=()=>{stage=1;started=Date.now();render()}}

function spotScene(){hazards.clear();let scored=false;const infos={kasten:['⚡ ELEKTROVERTEILER','Der Schaltschrank ist geöffnet. Teile können unter Spannung stehen. Nicht berühren und sichere Abschaltung durch Befugte veranlassen.'],person:['🧍 VERLETZTE PERSON','Die Person liegt regungslos. Erst nach sicherem Zugang annähern; dann Ansprechbarkeit und normale Atmung prüfen.'],warn:['⚠️ WARNSYMBOL','Das Warnzeichen weist auf elektrische Gefährdung hin. Die genaue Spannungslage ist nicht bekannt.'],umfeld:['↔️ UMGEBUNG','Weitere Personen auf Abstand halten, eigene Fluchtmöglichkeit beachten und Hilfe sowie 112 organisieren.']};shell('01 · Unfallstelle scannen',`<p><strong>Du bist als Erster vor Ort.</strong> Ein Kollege liegt neben einem geöffneten Elektroverteiler. Berühre noch nichts! <strong>Tippe die vier leuchtenden Markierungen im Bild an.</strong></p>${sceneArtwork(true)}<div class="card"><div class="scan-meter"><span id="hazcount">0 von 4 Punkten untersucht</span><div class="ticks" id="hazticks"><i></i><i></i><i></i><i></i></div></div><div id="hazout" class="scan-feed" aria-live="polite">Wähle im Bild eine Markierung aus, um den Gefahrenhinweis anzuzeigen.</div><div class="buttons"><button class="btn" id="hazgo" disabled>GEFAHRENCHECK ABSCHLIESSEN →</button></div></div><div class="tip">💡 <strong>Einsatzregel:</strong> Eigenschutz vor Fremdrettung. Bei unklarer Spannungslage Abstand halten und sichere Freigabe organisieren.</div>`,'LEVEL 01 · TACTICAL SCAN');document.querySelectorAll('.scan-target').forEach(b=>b.onclick=()=>{const k=b.dataset.k;hazards.add(k);b.classList.add('on');b.textContent='✓';b.setAttribute('aria-pressed','true');document.getElementById('hazout').innerHTML=`<b>${infos[k][0]}</b><p>${infos[k][1]}</p>`;document.getElementById('hazcount').textContent=`${hazards.size} von 4 Punkten untersucht`;document.getElementById('hazticks').innerHTML=Array.from({length:4},(_,i)=>`<i class="${i<hazards.size?'active':''}"></i>`).join('');if(hazards.size===4){if(!scored){addPts(20);scored=true}document.getElementById('hazgo').disabled=false;document.getElementById('hazout').innerHTML+='<p><strong>✅ Alle Gefahrenstellen geprüft. Jetzt entscheide, wie du dich verhältst.</strong></p>'}});document.getElementById('hazgo').onclick=next}
function decisionOne(){optionQuestion({title:'02 · Die erste Handlung',desc:sceneStrip('Der Schaltschrank ist geöffnet – die Stromversorgung ist noch nicht sicher.')+'<strong>Ein Kollege ruft:</strong> „Zieh ihn schnell vom Schaltschrank weg!“ Die Anlage ist möglicherweise noch unter Spannung. Wie reagierst du?',options:['Sofort anfassen und wegziehen','Abstand halten, Gefährdung beurteilen, Stromunterbrechung nur sicher veranlassen und Hilfe organisieren','Mit einer Metallstange versuchen, den Körper zu bewegen','Wasser über die Anlage kippen'],correct:1,why:'Eigenschutz hat Vorrang. Bei Niederspannung die Stromzufuhr nur über eine sicher bedienbare Abschaltmöglichkeit unterbrechen bzw. durch Befugte unterbrechen lassen. Bei unklarer Situation nicht annähern.',wrong:'Direkte Berührung könnte dich selbst zum Unfallopfer machen.',tip:'Niederspannung: bis 1.000 V AC. Hochspannung: über 1.000 V AC; Abstand halten, Fachpersonal muss freischalten.',after:()=>decisionTwo()})}
function decisionTwo(){optionQuestion({title:'02 · Ist die Anlage sicher?',desc:sceneStrip('Die Elektrofachkraft hat sicher abgeschaltet und den Zugang freigegeben.')+'Die verantwortliche Elektrofachkraft hat den betroffenen Stromkreis sicher abgeschaltet und den Bereich freigegeben. Der Kollege liegt regungslos am Boden. Was jetzt?',options:['Erst die Sicherung wieder einschalten, um den Fehler zu prüfen','Bewusstsein kontrollieren, laut um Hilfe rufen, Atmung kontrollieren und 112 veranlassen','Erst ein Foto als Unfallnachweis machen','Erst den Puls am Hals suchen und fünf Minuten beobachten'],correct:1,why:'Nach Freigabe: ansprechen und vorsichtig an den Schultern berühren; bei Bewusstlosigkeit Hilfe rufen, Atemwege öffnen und normale Atmung höchstens 10 Sekunden prüfen, Notruf veranlassen.',wrong:'Fehlersuche und Dokumentation dürfen die Rettung nicht verzögern. Laien sollen keine zeitaufwendige Pulssuche vornehmen.',tip:'Schnappatmung zählt nicht als normale Atmung. Die Leitstelle kann durch die Prüfung und Reanimation führen.',after:()=>{stage=3;render()}})}
const callPieces=[['Wo?','Neubau, Technikraum Erdgeschoss, Zugang über Haupteingang'],['Was?','Vermuteter elektrischer Unfall, Person bewusstlos'],['Wie viele?','Eine verletzte Person'],['Wie ist der Zustand?','Atmung wird geprüft; Leitstelle bekommt sofort aktuelle Angaben'],['Warten / Rückfragen','Am Telefon bleiben, auf Fragen antworten und Anweisungen befolgen']];function emergencyCall(){let chosen=[];let order=shuffle([0,1,2,3,4]);shell('03 · Notruf-Leitstelle',`${sceneStrip('Leitstelle 112 zugeschaltet – Informationen jetzt klar und ruhig weitergeben.')}<p>Die 112 ist gewählt. Welche Informationen gehören in deinen Notruf? Stelle das Einsatzprotokoll zusammen. Die Reihenfolge darf variieren – <strong>wichtig ist, auf Fragen der Leitstelle zu antworten.</strong></p><div class="card"><div class="smallcaps">NOTRUF 112 · DEIN PROTOKOLL</div><div id="callslots" style="margin:14px 0"></div><div id="callchoices" class="tiles"></div><div id="callfeedback"></div><div class="buttons"><button class="btn" id="callgo" disabled>NOTRUF ABGESCHLOSSEN →</button></div></div><div class="tip">📞 <strong>Insider-Tipp:</strong> Nenne besonders früh den genauen Ort und den Verdacht auf Stromunfall. Nicht auflegen, bevor die Leitstelle das Gespräch beendet.</div>`,'LEVEL 03 · MISSION KOMMUNIKATION');const draw=()=>{document.getElementById('callslots').innerHTML=chosen.length?chosen.map(i=>`<div class="slot filled">✓ <strong>${callPieces[i][0]}</strong> · ${callPieces[i][1]}</div>`).join(''):'<div class="slot">Noch keine Informationen ausgewählt.</div>';document.getElementById('callchoices').innerHTML=order.map(i=>chosen.includes(i)?'':`<div class="tile"><span><strong>${callPieces[i][0]}</strong><br><small>${callPieces[i][1]}</small></span><button data-call="${i}">Senden +</button></div>`).join('');document.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>{chosen.push(+b.dataset.call);draw()});if(chosen.length===5){addPts(25);document.getElementById('callfeedback').innerHTML='<div class="good">✅ Leitstelle vollständig informiert. Im echten Notruf folgen die Angaben den Fragen der Disponentin oder des Disponenten.</div>';document.getElementById('callgo').disabled=false}};draw();document.getElementById('callgo').onclick=next}

function cpr(){shell('04 · Wenn keine normale Atmung vorliegt',`${sceneStrip('Die Person atmet nicht normal – jetzt zählt die Reanimation.')}<p>Die Person ist bewusstlos und atmet <strong>nicht normal</strong>. Die elektrische Gefährdung ist sicher beseitigt, die 112 verständigt. Jetzt zählt konsequentes Handeln.</p><div class="card"><h3>Herzdruckmassage – Rhythmus-Trainer</h3><p>Übe den <strong>Rhythmus</strong> von 100–120 Kompressionen pro Minute mit der Animation. Das ersetzt keine Übung an einer Reanimationspuppe.</p><div class="rhythm"><div id="heart" class="heart">❤️</div><div><div class="counter" id="beatnum">0</div><div class="mini">Demo-Schläge</div></div></div><div class="buttons"><button class="btn" id="pulse">▶ RHYTHMUS STARTEN</button><button class="btn alt" id="stop">⏹ STOPP</button></div><div class="tip">💡 <strong>Merke:</strong> Mitte des Brustkorbs, 100–120/min, 5–6 cm tief, vollständig entlasten. Wenn geschult und bereit: 30 Kompressionen, 2 Beatmungen. Sonst durchgehend drücken. AED einschalten, sobald verfügbar, und seinen Anweisungen folgen.</div><div id="beatdone"></div><div class="buttons"><button class="btn" id="pulsego">ZUR NÄCHSTEN EINSATZLAGE →</button></div></div>`,'LEVEL 04 · PRÜFEN · RUFEN · DRÜCKEN');let running=false;document.getElementById('pulse').onclick=()=>{if(running)return;running=true;document.getElementById('heart').classList.add('pulse');beatTimer=setInterval(()=>{beats++;const el=document.getElementById('beatnum');if(el)el.textContent=beats},545)};document.getElementById('stop').onclick=()=>{running=false;clearInterval(beatTimer);beatTimer=null;document.getElementById('heart').classList.remove('pulse');document.getElementById('beatdone').innerHTML='<div class="mini">Rhythmus angehalten. Bei realer Wiederbelebung möglichst ohne Unterbrechungen weiterdrücken.</div>'};document.getElementById('pulsego').onclick=()=>{if(beats>=6)addPts(10);next()}}
function otherCase(){optionQuestion({title:'05 · Einsatzlage B: Hochspannung',desc:sceneStrip('Zweiter Einsatz: Außenanlage mit Hochspannungsgefahr.')+'<p>Ein zweiter Einsatz: Außenanlage eines Betriebs. Ein Arbeiter liegt neben einer beschädigten Hochspannungsleitung. Du erkennst ein Hochspannungs-Warnschild. Was tust du?</p>',options:['Sofort hinrennen und mit Handschuhen helfen','Großen Sicherheitsabstand (im Freien 20 m) halten, 112 mit Hinweis „Hochspannung“ rufen und Fachpersonal heranziehen','Mit einem trockenen Besenstiel die Leitung wegschieben','Zuerst testen, ob das Kabel noch Strom führt'],correct:1,why:'Bei Hochspannung niemals eigenständig zur verletzten Person vordringen. Im Freien mindestens 20 m Abstand als Grundregel; Anlagenbetreiber/Fachpersonal muss die Anlage sichern und Rettung freigeben.',wrong:'Auch ohne direkte Berührung drohen lebensgefährliche Lichtbögen und Schrittspannungen.',tip:'An Hochspannungsanlagen darf die Rettung erst nach Sicherung/Freigabe durch zuständiges Fachpersonal erfolgen.',after:()=>caseBnormal()})}
function caseBnormal(){optionQuestion({title:'05 · Der Bewusstlose atmet normal',desc:'Zurück im ersten Einsatz: Stromgefahr beseitigt. Die Person reagiert nicht, atmet aber eindeutig normal. Welche Maßnahme ist richtig?',options:['Stabile Seitenlage, Notruf sicherstellen, Atmung regelmäßig kontrollieren','Sofort Herzdruckmassage trotz normaler Atmung','Etwas zu trinken geben','Allein lassen und Ersatzteile suchen'],correct:0,why:'Bewusstlos bei normaler Atmung: stabile Seitenlage, 112 veranlassen, fortlaufend normale Atmung überwachen. Bei fehlender normaler Atmung sofort Wiederbelebung.',wrong:'Getränke sind bei Bewusstlosigkeit gefährlich; eine unbeaufsichtigte Person kann sich verschlechtern.',tip:'Auch nach einem scheinbar leichten Stromunfall ist eine ärztliche Untersuchung erforderlich – Herzrhythmusstörungen können verzögert auftreten.',after:()=>{stage=6;render()}})}
const steps=['Elektrische Gefährdung erkennen; Abstand halten und sichere Stromunterbrechung/Freigabe veranlassen','Nach gesichertem Zugang Ansprechbarkeit prüfen und laut um Hilfe rufen','112 veranlassen und Atmung höchstens 10 Sekunden kontrollieren','Keine normale Atmung: sofort mit Herzdruckmassage beginnen','AED organisieren bzw. einschalten und dessen Anweisungen befolgen','Reanimation mit Helferwechsel fortführen, bis Rettungsdienst übernimmt oder deutliche Lebenszeichen zurückkehren'];function finale(){placed=[];let pool=shuffle([0,1,2,3,4,5]);shell('06 · Abschlussmission: Einsatzplan',`${sceneStrip('Finale Einsatzlage: Person bewusstlos, keine normale Atmung, Rettungskette vollständig aufbauen.')}<p><strong>Abschlussszenario:</strong> Die elektrische Gefährdung ist sicher beseitigt. Die Person ist bewusstlos und hat <strong>keine normale Atmung</strong>. Erstelle jetzt den passenden Einsatzplan für genau diese Lage.</p><div class="card"><div class="smallcaps">DEIN EINSATZABLAUF · PERSON OHNE NORMALE ATMUNG</div><div id="flow" style="margin:12px 0"></div><div id="pool" class="tiles"></div><div id="flowfeed"></div><div class="buttons"><button class="btn ghost" id="undo">↶ LETZTEN SCHRITT ZURÜCK</button><button class="btn" disabled id="finish">EINSATZ ABSCHLIESSEN →</button></div></div><div class="tip">💡 <strong>Hinweis:</strong> In diesem Szenario gibt es <strong>keine stabile Seitenlage</strong>, weil die Person nicht normal atmet. Entscheidend ist jetzt die Rettungskette bis zur Reanimation.</div>`,'LEVEL 06 · FINAL BOSS');function draw(){document.getElementById('flow').innerHTML=placed.length?placed.map((v,i)=>`<div class="slot filled"><strong>${i+1}.</strong> ${steps[v]}</div>`).join(''):'<div class="slot">Wähle unten den ersten Schritt aus.</div>';document.getElementById('pool').innerHTML=pool.filter(i=>!placed.includes(i)).map(i=>`<div class="tile"><span>${steps[i]}</span><button data-pick="${i}">Einfügen +</button></div>`).join('');document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{placed.push(+b.dataset.pick);draw()});document.getElementById('finish').disabled=placed.length!==6}draw();document.getElementById('undo').onclick=()=>{placed.pop();draw()};document.getElementById('finish').onclick=()=>{let arr=[0,1,2,3,4,5];let perfect=arr.every((x,i)=>placed[i]===x);if(perfect)addPts(35);else {let correctPositions=placed.filter((v,i)=>v===i).length;addPts(correctPositions*5);errors++;}document.getElementById('flowfeed').innerHTML=`<div class="${perfect?'good':'warning'}"><strong>${perfect?'✅ Einsatzplan freigegeben!':'🧠 Einsatzplan prüfen!'}</strong><p>In diesem Szenario führt die Rettungskette nach der Atemkontrolle <strong>direkt zur Wiederbelebung</strong>.</p><p><strong>Orientierung:</strong> Eigenschutz → Freigabe/Zugang → Ansprechbarkeit → 112 und Atemkontrolle → Herzdruckmassage → AED → Reanimation fortführen.</p></div>`;document.getElementById('finish').disabled=true;document.getElementById('undo').disabled=true;document.querySelectorAll('[data-pick]').forEach(b=>b.disabled=true);const x=document.createElement('button');x.className='btn';x.textContent='ZUR EINSATZAUSWERTUNG →';x.onclick=next;document.getElementById('flowfeed').appendChild(x)}}
function results(){let grade=points>=112?'EINSATZPROFI':points>=80?'GUTER ERSTHELFER':'WEITERTRAINIEREN';let duration=Math.round((Date.now()-started)/60000);shell('07 · Deine Einsatz-Auswertung',`<div class="card"><div class="smallcaps">EINSATZBERICHT / MISSION 112</div><div class="resultbig">${points}<span style="font-size:22px;color:#a5b9c8"> / ${maxPoints}</span></div><h2>${grade} ${points>=112?'🏅':'⚡'}</h2><div class="statline"><div class="stat">🔁 ${errors} Lernmomente</div><div class="stat">⏱ ${duration} min Spielzeit</div><div class="stat">📍 2 Einsatzlagen</div></div><p><strong>Deine drei wichtigsten Merksätze:</strong></p><div class="checklist"><div class="check">⚡ <strong>Eigenschutz:</strong> Stromgefahr zuerst sicher beherrschen. Bei Hochspannung Abstand halten – Rettung durch Fachpersonal.</div><div class="check">📞 <strong>Notruf:</strong> 112, Ort und Zustand mitteilen, Fragen beantworten, am Telefon bleiben.</div><div class="check">❤️ <strong>Erste Hilfe:</strong> Keine normale Atmung → drücken und AED. Normale Atmung bei Bewusstlosigkeit → Seitenlage und kontrollieren.</div></div><div class="buttons"><button class="btn" id="again">↻ MISSION NOCHMAL SPIELEN</button><button class="btn alt" id="copy">📋 EINSATZBERICHT KOPIEREN</button></div><div class="tip">💬 <strong>Diskutiere im Team:</strong> Welche Fehlentscheidung wäre am gefährlichsten gewesen? Warum? Welche Maßnahme übernimmt eine Elektrofachkraft – und welche du als Ersthelfender?</div>`,'MISSION ABGESCHLOSSEN');document.getElementById('again').onclick=()=>{stage=0;points=0;errors=0;hazards=new Set();beats=0;render()};document.getElementById('copy').onclick=()=>{let t=`MISSION 112 · Einsatzbericht\nPunkte: ${points}/${maxPoints}\nLernmomente: ${errors}\nMerksätze: Eigenschutz vor Fremdhilfe; 112; fehlende normale Atmung → Reanimation und AED; normale Atmung bei Bewusstlosigkeit → Seitenlage.`;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t).then(()=>alert('Einsatzbericht kopiert.')).catch(()=>prompt('Kopiere deinen Bericht:',t))}else prompt('Kopiere deinen Bericht:',t)}}render();
</script></body></html>
